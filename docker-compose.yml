# Dois modos de execução:
#
#   docker compose up --build
#       Desenvolvimento: API em http://localhost:8080 e MySQL em localhost:3307,
#       sem HTTPS.
#
#   docker compose --profile producao up -d --build
#       Produção (VPS): acrescenta o Caddy, que atende HTTPS nas portas 80 e 443
#       no domínio definido em DOMINIO e repassa para a API, e o backup diário
#       do MySQL. Veja o passo a passo no README.
#
# Em ambos os modos, a API e o MySQL só aceitam conexões da própria máquina
# (127.0.0.1): na VPS, o único acesso de fora é pelo Caddy.

# Logs de todos os serviços com rotação: sem limite, o driver padrão do Docker
# (json-file) cresce até encher o disco da VPS. Guarda até 5 arquivos de 10 MB
# por container ("docker compose logs" lê todos eles)
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.0
    container_name: cripto-mysql
    restart: always
    logging: *logs
    # recusa qualquer conexão sem TLS. O MySQL 8 gera o próprio certificado
    # ao inicializar o banco, então não há certificados para criar ou distribuir
    command: --require-secure-transport=ON
    environment:
      MYSQL_DATABASE: criptovision
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: .
    container_name: cripto-api
    restart: always
    logging: *logs
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    environment:
      # sslMode=REQUIRED: a conexão com o banco é sempre cifrada, e a senha do
      # login (caching_sha2_password) viaja dentro do TLS. Por isso não é preciso
      # allowPublicKeyRetrieval, que deixaria o driver aceitar a chave pública
      # de qualquer servidor que respondesse no lugar do MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/criptovision?sslMode=REQUIRED&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # aceita os cabeçalhos X-Forwarded-* só de IPs internos (o Caddy, na rede
      # do Docker), para que o IP do cliente e o HTTPS sejam os reais. É seguro
      # porque a porta da API só aceita conexões da própria máquina
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # logs em JSON (formato ECS), um objeto por linha, com o ID da requisição
      # no campo requestId: prontos para uma ferramenta de logs filtrar e alertar
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      BINANCE_API_BASE_URL: ${BINANCE_API_BASE_URL:-https://data-api.binance.vision/api/v3}
      COTACOES_CONNECT_TIMEOUT: ${COTACOES_CONNECT_TIMEOUT:-3s}
      COTACOES_READ_TIMEOUT: ${COTACOES_READ_TIMEOUT:-5s}
      COTACOES_CACHE_TTL: ${COTACOES_CACHE_TTL:-60s}
      COTACOES_CACHE_MAX_STALE: ${COTACOES_CACHE_MAX_STALE:-15m}

  caddy:
    image: caddy:2
    container_name: cripto-caddy
    restart: always
    logging: *logs
    profiles:
      - producao
    depends_on:
      - api
    environment:
      DOMINIO: ${DOMINIO:-}
    # sem DOMINIO, o Caddy não teria para qual domínio emitir o certificado.
    # A checagem fica aqui, e não no Compose, para não exigir DOMINIO em desenvolvimento
    entrypoint:
      - /bin/sh
      - -c
      - >-
        test -n "$$DOMINIO" || {
        echo 'Defina DOMINIO no .env (por exemplo api.seudominio.com.br) para usar o perfil producao.' >&2;
        exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # certificados e chaves emitidos: perder este volume obriga a emitir de novo
      - caddy_data:/data
      - caddy_config:/config

  backup:
    build: ./backup
    container_name: cripto-backup
    restart: always
    logging: *logs
    # em produção sobe junto com o Caddy; "--profile backup" sobe só o backup,
    # para testar localmente sem HTTPS
    profiles:
      - producao
      - backup
    depends_on:
      - db
    # um backup por dia (BACKUP_HORARIO, em UTC), cifrado com BACKUP_SENHA e,
    # se BACKUP_S3_BUCKET estiver definido, copiado para o bucket. Veja o README
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_SENHA: ${BACKUP_SENHA:-}
      BACKUP_HORARIO: ${BACKUP_HORARIO:-03:00}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
      BACKUP_RETENCAO_REMOTA_DIAS: ${BACKUP_RETENCAO_REMOTA_DIAS:-30}
      BACKUP_TESTE_SEMANAL: ${BACKUP_TESTE_SEMANAL:-true}
      BACKUP_S3_PROVEDOR: ${BACKUP_S3_PROVEDOR:-Other}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGIAO: ${BACKUP_S3_REGIAO:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PASTA: ${BACKUP_S3_PASTA:-criptovision}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - mysql_backups:/backups

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  mysql_backups:
