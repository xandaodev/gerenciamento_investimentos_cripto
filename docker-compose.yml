services:
  db:
    image: mysql:8.0
    container_name: cripto-mysql
    restart: always
    environment:
      MYSQL_DATABASE: criptovision
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: .
    container_name: cripto-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/criptovision?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      BINANCE_API_BASE_URL: ${BINANCE_API_BASE_URL:-https://data-api.binance.vision/api/v3}
      COTACOES_CONNECT_TIMEOUT: ${COTACOES_CONNECT_TIMEOUT:-3s}
      COTACOES_READ_TIMEOUT: ${COTACOES_READ_TIMEOUT:-5s}
      COTACOES_CACHE_TTL: ${COTACOES_CACHE_TTL:-60s}
      COTACOES_CACHE_MAX_STALE: ${COTACOES_CACHE_MAX_STALE:-15m}

volumes:
  mysql_data:
