name: Testes do backend

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes com Maven
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # falha cedo se o docker-compose, o Caddyfile ou os scripts tiverem erro
      - name: Validar o docker-compose, o Caddyfile e os scripts
        run: |
          docker compose --profile producao config --quiet
          docker run --rm -e DOMINIO=api.exemplo.com.br \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -v "$PWD:/src:ro" koalaman/shellcheck:stable \
            -S warning /src/backup/backup.sh /src/scripts/testar-stack.sh

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      # verify roda os testes unitários (surefire, com H2) e depois os testes
      # de integração (*IT.java, failsafe) contra um MySQL 8 real via Testcontainers.
      # O runner ubuntu-latest já tem Docker disponível.
      - name: Executar os testes unitários e de integração
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  imagem:
    name: Imagem Docker e stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      # o Buildx guarda as camadas no cache do GitHub Actions, inclusive as do
      # estágio de build (o Maven e as dependências). Sem isso, cada execução
      # baixava tudo do Maven Central, e um 429 de lá já derrubou este job
      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir a imagem de produção com cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: criptovision-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # sobe db + api pelo docker-compose com a imagem construída acima: confere
      # o HEALTHCHECK, o depends_on, o usuário sem root, o limite de memória da
      # JVM, os logs em JSON e o graceful shutdown
      - name: Testar a imagem de produção e a stack do docker-compose
        env:
          IMAGEM_API: criptovision-api:ci
        run: bash scripts/testar-stack.sh
