name: Testes do backend

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes com Maven
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # falha cedo se o docker-compose, o Caddyfile ou o script de backup tiverem erro
      - name: Validar o docker-compose, o Caddyfile e o script de backup
        run: |
          docker compose --profile producao config --quiet
          docker run --rm -e DOMINIO=api.exemplo.com.br \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -v "$PWD/backup:/src:ro" koalaman/shellcheck:stable \
            -S warning /src/backup.sh

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      # verify roda os testes unitários (surefire, com H2) e depois os testes
      # de integração (*IT.java, failsafe) contra um MySQL 8 real via Testcontainers.
      # O runner ubuntu-latest já tem Docker disponível.
      - name: Executar os testes unitários e de integração
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
