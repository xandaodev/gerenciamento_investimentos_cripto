# Banco H2 temporário utilizado apenas durante os testes
spring.datasource.url=jdbc:h2:mem:criptovision-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# O schema é criado antes dos testes e removido ao final
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Configuração fictícia usada somente nos testes
api.security.token.secret=criptovision-test-secret-with-more-than-32-characters

# Evita saída excessiva do Hibernate nos testes
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Os testes atuais deixam o Hibernate criar o schema temporário do H2
spring.flyway.enabled=false

# Configuração determinística das cotações nos testes
binance.api.base-url=http://localhost
cotacoes.http.connect-timeout=1s
cotacoes.http.read-timeout=1s
cotacoes.cache.ttl=60s
cotacoes.cache.max-stale=15m
