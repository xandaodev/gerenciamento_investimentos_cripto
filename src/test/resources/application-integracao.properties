# Perfil dos testes de integração (*IT.java), que rodam contra um MySQL 8 real
# em container (Testcontainers). A conexão vem do container por @ServiceConnection
# (veja MysqlContainerConfiguration), por isso este arquivo não define URL,
# usuário nem senha do banco.

# Mesmo comportamento da produção: o Flyway cria o schema e o Hibernate só valida
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Configuração fictícia usada somente nos testes
api.security.token.secret=criptovision-integracao-secret-with-more-than-32-characters

# Evita saída excessiva do Hibernate nos testes
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Nenhum teste de integração acessa a Binance real
binance.api.base-url=http://localhost
cotacoes.http.connect-timeout=1s
cotacoes.http.read-timeout=1s
cotacoes.cache.ttl=60s
cotacoes.cache.max-stale=15m
