spring.application.name=criptovision-api

# Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/criptovision?serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate apenas valida o schema criado pelo Flyway
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Migrations do banco
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# API externa da Binance
binance.api.base-url=https://api.binance.com/api/v3

# Segredo usado para assinar os tokens JWT
api.security.token.secret=${JWT_SECRET}


# Documentação OpenAPI e Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
