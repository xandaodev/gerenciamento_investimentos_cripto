spring.application.name=criptovision-api

# Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/criptovision?serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate apenas valida o schema criado pelo Flyway. O SQL só vai para o log se
# JPA_SHOW_SQL=true (útil no ambiente local; nunca em produção)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=validate

# Migrations do banco
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# API externa da Binance
binance.api.base-url=${BINANCE_API_BASE_URL:https://data-api.binance.vision/api/v3}

# Segredo usado para assinar os tokens JWT
api.security.token.secret=${JWT_SECRET}

# Origens do frontend autorizadas pelo CORS, separadas por vírgula.
# Sem a variável, só o frontend local do Vite é aceito
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Cabeçalhos X-Forwarded-* do proxy reverso (Caddy). O docker-compose usa "native",
# que só aceita os cabeçalhos vindos de IPs internos. Sem proxy na frente, mantenha
# "none": caso contrário, um cliente poderia forjar o próprio IP
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

# Proteção contra força bruta em /auth/login e /auth/register (respostas 429).
# Os contadores ficam na memória da instância. Atrás de um proxy reverso,
# configure server.forward-headers-strategy para que o IP seja o do cliente
seguranca.tentativas.login-por-ip.maximo=20
seguranca.tentativas.login-por-ip.janela=1m
seguranca.tentativas.falhas-por-login.maximo=5
seguranca.tentativas.falhas-por-login.janela=15m
seguranca.tentativas.cadastro-por-ip.maximo=10
seguranca.tentativas.cadastro-por-ip.janela=1h


# Documentação OpenAPI e Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Resiliência das cotações
cotacoes.http.connect-timeout=${COTACOES_CONNECT_TIMEOUT:3s}
cotacoes.http.read-timeout=${COTACOES_READ_TIMEOUT:5s}
cotacoes.cache.ttl=${COTACOES_CACHE_TTL:60s}
cotacoes.cache.max-stale=${COTACOES_CACHE_MAX_STALE:15m}

# Observabilidade (Actuator). O health completo e as métricas ficam numa porta de
# gerenciamento separada, que por padrão só escuta no loopback (dentro do container,
# no docker-compose). Ela não é publicada pelo compose nem passa pelo Caddy.
# Para um Prometheus coletar as métricas de outro container, use
# MANAGEMENT_SERVER_ADDRESS=0.0.0.0 (a porta continua fora da internet)
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

# Health público em /saude, na porta da API: só {"status":"UP"} (200) ou DOWN (503),
# sem componentes nem detalhes. Inclui o banco: sem MySQL, a API não funciona
management.endpoint.health.group.publico.include=db,ping
management.endpoint.health.group.publico.additional-path=server:/saude
management.endpoint.health.group.publico.show-components=never
management.endpoint.health.group.publico.show-details=never

# Cada linha de log leva o ID da requisição (cabeçalho X-Request-Id), como "[id] ".
# Fora de uma requisição (subida, tarefas), o replace tira o "[] " vazio. O valor não
# pode terminar em espaço, porque o espaço final se perde. No docker-compose, os logs
# saem em JSON (LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs), com o ID no campo requestId
logging.pattern.correlation=%replace([%X{requestId}] ){'^.{2} $', ''}
